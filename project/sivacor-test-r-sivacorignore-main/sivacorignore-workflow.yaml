# SIVACOR workflow definition
#
# Import this file at the top of the submission form
# (https://submit.sivacor.org/) to fill in the steps.
#
# image_name and image_tag must be copied verbatim from the list
# that fills the form's dropdowns:
#   https://girder.sivacor.org/api/v1/sivacor/image_tags

stages:
  - image_name: "rocker/r-ver"
    image_tag: "4.3.1"
    main_file: "main.R"
    # network access is needed for renv
    network_isolation: false
